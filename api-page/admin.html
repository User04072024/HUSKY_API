<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070a11" />
  <title>Husky API // Admin</title>
  <link rel="stylesheet" href="./assets/dashboard.css" />
  <style>
    .admin-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .admin-card { width: min(520px, 100%); border: 1px solid rgba(34,211,238,.3); background: #0c121e; padding: 28px; box-shadow: 0 0 36px rgba(34,211,238,.08); }
    .admin-card h1 { margin: 6px 0 12px; font-family: "Space Grotesk", sans-serif; }
    .admin-card p { color: #7890a8; font-size: 12px; line-height: 1.6; }
    .admin-login { display: inline-block; margin-top: 18px; border: 1px solid #22d3ee; background: #22d3ee; color: #031018; padding: 12px 16px; font: 700 11px "JetBrains Mono", monospace; text-decoration: none; }
    .admin-login:hover { background: #a5f3fc; }
    .admin-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .admin-login--github { border-color: #c4b5fd; background: #c4b5fd; }
    .admin-user { display: none; align-items: center; gap: 12px; margin-top: 20px; color: #86efac; font: 12px "JetBrains Mono", monospace; }
    .admin-user img { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #22d3ee; }
    .admin-editor { display: none; margin-top: 26px; }
    .admin-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
    .admin-nav a, .admin-tab, .admin-save { border: 1px solid #24506a; background: #101c2b; color: #b9d8e8; padding: 10px 12px; font: 700 10px "JetBrains Mono", monospace; text-decoration: none; cursor: pointer; }
    .admin-tab.active, .admin-save { border-color: #22d3ee; background: #22d3ee; color: #031018; }
    .admin-editor textarea { width: 100%; min-height: 360px; box-sizing: border-box; resize: vertical; border: 1px solid #24506a; background: #07101d; color: #d8f3ff; padding: 14px; font: 12px/1.6 "JetBrains Mono", monospace; outline: none; }
    .admin-status { min-height: 18px; margin-top: 10px; color: #86efac; font: 11px "JetBrains Mono", monospace; }
  </style>
</head>
<body>
  <main class="admin-shell">
    <section class="admin-card">
      <div class="eyebrow">husky api // protected area</div>
      <h1>Editor administrativo</h1>
      <p>Accede al editor con tu cuenta autorizada de Google (Gmail) o GitHub mediante Supabase.</p>
        <div class="admin-actions">
          <button class="admin-login" id="googleLogin" type="button">CONTINUAR CON GOOGLE</button>
          <button class="admin-login admin-login--github" id="githubLogin" type="button">CONTINUAR CON GITHUB</button>
        </div>
      <div class="admin-user" id="adminUser"></div>
      <div class="admin-editor" id="adminEditor">
        <nav class="admin-nav" aria-label="Enlaces administrativos">
          <a href="/dashboard">ABRIR DASHBOARD</a>
          <a href="/docs">VER DOCUMENTACIÓN</a>
          <button class="admin-tab active" data-content="openapi" type="button">OPENAPI</button>
          <button class="admin-tab" data-content="notifications" type="button">NOTIFICACIONES</button>
        </nav>
        <textarea id="contentEditor" spellcheck="false" aria-label="Editor JSON"></textarea>
        <div>
          <button class="admin-save" id="saveContent" type="button">GUARDAR CAMBIOS</button>
          <div class="admin-status" id="adminStatus"></div>
        </div>
      </div>
    </section>
  </main>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const loginButton = document.getElementById('googleLogin');
    const githubButton = document.getElementById('githubLogin');
    const userBox = document.getElementById('adminUser');
    const editorBox = document.getElementById('adminEditor');
    const contentEditor = document.getElementById('contentEditor');
    const statusBox = document.getElementById('adminStatus');
    const tabs = [...document.querySelectorAll('.admin-tab')];
    let activeContent = 'openapi';

    const configResponse = await fetch('/api/auth/config');
    const config = await configResponse.json();
    if (!configResponse.ok) {
      loginButton.disabled = true;
      githubButton.disabled = true;
      loginButton.textContent = 'SUPABASE NO CONFIGURADO';
      throw new Error(config.message);
    }
    const supabase = createClient(config.url, config.anonKey);

    const signIn = async (provider) => {
      const { error } = await supabase.auth.signInWithOAuth({
        provider,
        options: { redirectTo: `${location.origin}/admin` }
      });
      if (error) alert(error.message);
    };
    loginButton.addEventListener('click', () => signIn('google'));
    githubButton.addEventListener('click', () => signIn('github'));

    const loadContent = async (content, accessToken) => {
      activeContent = content;
      statusBox.textContent = 'Cargando...';
      const response = await fetch(`/api/admin/content/${content}`, { headers: { Authorization: `Bearer ${accessToken}` } });
      const result = await response.json();
      if (!response.ok) throw new Error(result.message || 'No se pudo cargar el contenido.');
      contentEditor.value = JSON.stringify(result.data, null, 2);
      statusBox.textContent = `Editando ${content}.`;
      tabs.forEach((tab) => tab.classList.toggle('active', tab.dataset.content === content));
    };

    const saveContent = async (accessToken) => {
      let payload;
      try { payload = JSON.parse(contentEditor.value); } catch { statusBox.textContent = 'Error: el JSON no es válido.'; return; }
      statusBox.textContent = 'Guardando...';
      const response = await fetch(`/api/admin/content/${activeContent}`, { method: 'PUT', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` }, body: JSON.stringify(payload) });
      const result = await response.json();
      statusBox.textContent = result.message || 'Cambios guardados.';
    };

    const { data } = await supabase.auth.getSession();
    if (data.session) {
      const response = await fetch('/api/admin/session', { headers: { Authorization: `Bearer ${data.session.access_token}` } });
      if (response.ok) {
        const admin = await response.json();
        loginButton.style.display = 'none';
        githubButton.style.display = 'none';
        userBox.style.display = 'flex';
        userBox.innerHTML = `<img src="${admin.user.avatar || ''}" alt=""><span>Sesión activa: ${admin.user.email}</span>`;
        editorBox.style.display = 'block';
        tabs.forEach((tab) => tab.addEventListener('click', () => loadContent(tab.dataset.content, data.session.access_token).catch((error) => { statusBox.textContent = error.message; })));
        document.getElementById('saveContent').addEventListener('click', () => saveContent(data.session.access_token).catch((error) => { statusBox.textContent = error.message; }));
        await loadContent(activeContent, data.session.access_token);
      } else {
        await supabase.auth.signOut();
        alert('Esta cuenta de GitHub o Google no tiene permisos de editor.');
      }
    }
  </script>
</body>
</html>
